<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            background-color: whitesmoke;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            cursor: pointer;
            user-select: none;
        }
        h1 {
            color: #333;
            text-align: center;
            margin: 0;
        }
        img {
            display: none;
            width: 100 vw;
            height: auto;
         
        }
    </style>
</head>
<body>

    <h1 id="hinweis">Bitte drücke den Screen...</h1>

    <img id="mario" src="https://cdn.jsdelivr.net/gh/AsukiAoyama/BD1@main/Gif1.gif" alt="Mario">

    <audio id="meinAudio" src="https://cdn.jsdelivr.net/gh/AsukiAoyama/BD1@main/sound1.mp3" loop></audio>

   <script>
        const audio = document.getElementById('meinAudio');
        const hinweis = document.getElementById('hinweis');
        const mario = document.getElementById('mario');

        document.body.addEventListener('click', () => {
            hinweis.style.display = 'none';
            mario.style.display = 'block';
            audio.play();
        }, { once: true });

        // Wartet 1500 ms nach Ende des Sounds und startet ihn neu
        audio.addEventListener('ended', () => {
            setTimeout(() => {
                audio.play();
            }, 1500);
        });
    </script>
</body>
</html>
